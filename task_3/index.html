<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Laman Pendaftaran</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <header class = "header">
            <h1>Pengembangan Aplikasi Web</h1>
            <nav class = "nav">
                <ul>
                    <li><a href="index.html">Pendaftaran</a></li>
                    <li><a href="detail.html">Detail Pendaftaran</a></li>
                </ul>
            </nav>
        </header>
        
        <main class = "container">
            <section class = "card"> 
                <h2>Form Pendaftaran</h2>
                <p class = "subtitle">Silakan isi formulir di bawah ini untuk mendaftar.</p>
                <form method="get" action="detail.html">
                    <fieldset style = "border:none;">
                        <div  class = "form-row">
                            <label for="nama">Nama Lengkap:</label>
                            <input type="text" id="nama" name="nama"
                                        placeholder="Masukkan nama lengkap Anda" required>
                        </div>

                        <div class = "form-row">
                            <label for="nim">NIM:</label>
                            <input type="text" id="nim" name="nim"
                                        placeholder="Contoh: 123140180"
                                        pattern="[0-9]{9}" title="NIM harus terdiri dari 9 digit angka"
                                        required>
                        </div>

                        <div class = "form-row">
                            <label for="email">Email:</label>
                            <input type="email" id="email" name="email"
                            placeholder="contoh@gmail.com" required>
                        </div>

                        <div class = "form-row">
                            <label for="lahir">Tanggal Lahir:</label>
                            <input type="date" id="lahir" name="lahir">
                        </div>

                        <div class = "form-row">
                            <label for="gender">Jenis Kelamin:</label>
                            <select id="gender" name="gender" required>
                                <option value="" disabled selected hidden>Pilih jenis kelamin</option>
                                <option value="laki-laki">Laki-laki</option>
                                <option value="perempuan">Perempuan</option>
                            </select>
                        </div>
                        
                        <div class = "form-row">
                            <label for="motivasi">Motivasi:</label>
                            <textarea id="motivasi" name="motivasi" rows="4" cols="50" placeholder="Tuliskan motivasi kamu untuk mendaftar" required></textarea>
                        </div>
                    </fieldset>

                    <div class="tombol-area">
                        <button type="submit" class="tombol">Daftar</button>
                    </div>
                </form>
            </section>
        </main>

        <footer class = "footer">
            <p>&copy; Tugas Pengembangan Aplikasi Web. All rights reserved.</p>
        </footer>
    </body>
</html>
